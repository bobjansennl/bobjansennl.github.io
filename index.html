    <title>Bob Jansen</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👨‍💻</text></svg>">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body, html {
            height: 100%;
            width: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(-45deg, #0f172a, #1e293b, #334155, #1e1b4b);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: white;
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .main-content {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            animation: fadeIn 2s ease-out;
        }

        h1 {
            font-size: clamp(2.5rem, 7vw, 4.5rem);
            font-weight: 700;
            letter-spacing: -2px;
            margin-bottom: 0.5rem;
        }

        .line-main {
            height: 1px;
            width: 30px;
            background: rgba(255, 255, 255, 0.3);
            margin: 15px auto;
        }

        .domain-name {
            font-size: 0.8rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            opacity: 0.4;
            font-weight: 300;
            margin-bottom: 2.5rem;
        }

        /* Social Icons Rij */
        .social-links {
            display: flex;
            gap: 25px;
            justify-content: center;
            align-items: center;
        }

        .social-icon {
            text-decoration: none;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .social-icon svg {
            width: 28px;
            height: 28px;
            fill: rgba(255, 255, 255, 0.3); /* Standaard grijs */
            transition: fill 0.3s ease, transform 0.3s ease;
        }

        /* Kleuren bij hover */
        .social-icon.linkedin:hover svg { fill: #0077b5; transform: scale(1.1); }
        .social-icon.github:hover svg { fill: #ffffff; transform: scale(1.1); }
        .social-icon.email:hover svg { fill: #ea4335; transform: scale(1.1); }

        /* Certificeringen aan de bodem */
        .footer-certs {
            position: absolute;
            bottom: 40px;
            left: 0;
            right: 0;
            text-align: center;
            padding: 0 20px;
            animation: fadeInBottom 2.5s ease-out;
        }

        .certs-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
        }

        .certs-title {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            opacity: 0.3;
            font-weight: 400;
            padding-bottom: 8px;
        }

        .certs-underline {
            height: 1px;
            width: 150px;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.15), transparent);
        }

        .certs-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 35px;
            justify-content: center;
        }

        .cert-link {
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.4s ease;
        }

        .cert-link svg {
            width: 22px;
            height: 22px;
            fill: rgba(255, 255, 255, 0.2);
            margin-bottom: 8px;
            transition: fill 0.4s ease, transform 0.4s ease;
        }

        .cert-link:hover svg {
            fill: rgba(255, 255, 255, 0.7);
            transform: translateY(-3px);
        }

        .cert-name {
            font-size: 0.65rem;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.25);
            letter-spacing: 0.5px;
            transition: color 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInBottom {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @media (max-height: 700px) {
            body, html { overflow: auto; }
            .footer-certs { position: relative; bottom: auto; margin-top: 60px; padding-bottom: 40px; }
        }
    </style>
</head>
<body>
