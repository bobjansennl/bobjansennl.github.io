<html lang="nl">
<head>

    <meta charset="UTF-8">

    <title>Bob Jansen</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👨‍💻</text></svg>">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..800&family=Geist+Mono:wght@100..400&display=swap" rel="stylesheet">
    
    <style>
        /* RESET & BASE */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        ::selection { background: rgba(59, 130, 246, 0.3); color: white; }

        html { height: 100%; }

        body {
            font-family: 'Geist', sans-serif;
            -webkit-font-smoothing: antialiased;
            color: white;
            background-color: #0f172a;
            background: linear-gradient(-45deg, #0f172a, #1e293b, #1e1b4b, #0f172a);
            background-size: 400% 400%;
            animation: combinedAnim 15s ease infinite;
            /* Cruciaal voor mobiele scroll */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* GRID BACKGROUND */
        body::before {
            content: ""; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px; 
            background-position: center center;
            -webkit-mask-image: radial-gradient(ellipse at center, black 10%, transparent 80%);
            mask-image: radial-gradient(ellipse at center, black 10%, transparent 80%);
            pointer-events: none; z-index: 0;
        }

        @keyframes combinedAnim { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        /* LAYOUT CONTAINER */
        .main-wrapper {
            flex: 1; /* Vult minimaal het scherm */
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 1;
            width: 100%;
        }

        /* HERO SECTION (Naam, Tagline, URL, Socials) */
        .hero-section {
            /* Margin auto zorgt voor verticale centrering in de beschikbare ruimte */
            margin-top: auto;
            margin-bottom: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 20px;
            animation: fadeIn 2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        h1 { 
            font-size: clamp(2.5rem, 7vw, 4.5rem); 
            font-weight: 800; 
            letter-spacing: -0.05em; 
            line-height: 1.1;
            margin-bottom: 12.5px;
        }

        .tagline-container {
            width: 100%; height: 25px; display: flex; align-items: center; justify-content: center;
            background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px); border-radius: 999px; 
            border: 1px solid rgba(255, 255, 255, 0.04); margin-bottom: 25px;
            cursor: default;
        }

        .tagline {
            font-size: clamp(0.55rem, 1vw, 0.7rem);
            font-weight: 100; letter-spacing: 0.35em; 
            color: rgba(255, 255, 255, 0.5); text-transform: uppercase; white-space: nowrap;
        }

        .domain-name { 
            font-family: 'Geist Mono', monospace; font-size: 0.6rem; 
            letter-spacing: 0.5em; text-transform: uppercase; font-weight: 300; 
            margin-bottom: 40px; display: flex; align-items: center;
            justify-content: center; width: 450px; white-space: nowrap;
            animation: linePulse 6s infinite ease-in-out;
        }

        @keyframes linePulse { 0%, 100% { opacity: 0.2; } 50% { opacity: 0.45; } }
        .domain-name::before, .domain-name::after { content: ""; height: 1px; flex-grow: 1; background: linear-gradient(to right, transparent, white); margin: 0 20px; }
        .domain-name::after { background: linear-gradient(to left, transparent, white); }
        
        .social-links { display: flex; gap: 30px; justify-content: center; margin-bottom: 20px; }
        .social-icon svg { width: 22px; height: 22px; fill: rgba(255, 255, 255, 0.25); transition: 0.3s; cursor: pointer; }
        .social-icon:hover svg { fill: white; transform: translateY(-3px); }

        /* FOOTER CERTS */
        .footer-certs { 
            /* Push naar beneden in de flex container */
            margin-top: auto; 
            width: 450px;
            /* Zorgt dat hij horizontaal gecentreerd blijft in de flex kolom */
            align-self: center; 
            display: flex;
            align-items: center;
            cursor: pointer;
            z-index: 10;
            padding-bottom: 20px; /* Ruimte onderaan het scherm */
        }
        
        .certs-header { display: flex; flex-direction: column; align-items: center; width: 100%; padding: 15px 0; }
        .certs-title { font-family: 'Geist Mono', monospace; font-size: 0.5rem; text-transform: uppercase; letter-spacing: 0.3em; opacity: 0.3; padding-bottom: 12px; }
        .certs-underline-container { display: flex; align-items: center; justify-content: center; width: 100%; gap: 15px; }
        .line-half { height: 1px; flex-grow: 1; background: linear-gradient(to right, transparent, rgba(255,255,255,0.1)); }
        .line-half.right { background: linear-gradient(to left, transparent, rgba(255,255,255,0.1)); }
        .chevron { width: 10px; height: 10px; fill: rgba(255,255,255,0.15); transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
        .footer-certs.active .chevron { transform: rotate(180deg); }

        .glass-panel-container {
            max-height: 0; overflow: hidden; opacity: 0; transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            width: 100%; background: rgba(255, 255, 255, 0.01);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); 
            border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.03);
        }
        
        .certs-grid { display: flex; width: 100%; }
        .cert-item { flex: 1; padding: 25px 5px; opacity: 0; transform: translateY(10px); transition: all 0.6s ease; text-align: center; position: relative; }
        .footer-certs.active .cert-item { opacity: 1; transform: translateY(0); }
        .footer-certs.active .cert-item:nth-child(1) { transition-delay: 0.1s; }
        .footer-certs.active .cert-item:nth-child(2) { transition-delay: 0.2s; }
        .footer-certs.active .cert-item:nth-child(3) { transition-delay: 0.3s; }

        .cert-item:not(:last-child)::after { content: ""; position: absolute; right: 0; top: 25%; bottom: 25%; width: 1px; background: linear-gradient(to bottom, transparent, rgba(255, 255, 255, 0.05), transparent); }
        .cert-icon svg { width: 18px; height: 18px; fill: rgba(255, 255, 255, 0.12); margin-bottom: 15px; }
        .footer-certs.active .cert-item:nth-child(1) .cert-icon svg { fill: #fbbc04; }
        .footer-certs.active .cert-item:nth-child(2) .cert-icon svg { fill: #00a4ef; }
        .footer-certs.active .cert-item:nth-child(3) .cert-icon svg { fill: #10b981; }

        .cert-links-list { list-style: none; padding: 0; }
        .cert-links-list a { font-family: 'Geist Mono', monospace; color: rgba(255, 255, 255, 0.25); text-decoration: none; font-size: 0.6rem; transition: 0.3s; }
        .cert-links-list a:hover { color: white; }

        /* --- DESKTOP LOGICA --- */
        @media (min-width: 769px) {
            /* Fixeert de footer onderaan, los van de flow */
            .footer-certs {
                position: absolute;
                bottom: 50px;
                left: 50%;
                transform: translateX(-50%);
                flex-direction: column-reverse; /* Panel opent OMHOOG */
                margin-top: 0; /* Reset de margin-auto */
            }
            .glass-panel-container {
                margin-bottom: 25px; /* Ruimte tussen panel en header */
            }
            .footer-certs.active .glass-panel-container { max-height: 500px; opacity: 1; }
        }

        /* --- MOBILE LOGICA --- */
        @media (max-width: 768px) { 
            .header-group, .domain-name, .footer-certs { width: 90vw; }
            
            /* Footer blijft in de flow, dus geen overlap */
            .footer-certs {
                position: relative;
                flex-direction: column; /* Panel opent OMLAAG */
                transform: none;
                left: auto;
                margin-bottom: 20px;
            }
            .glass-panel-container {
                margin-top: 10px; /* Ruimte tussen header en panel */
            }
            .footer-certs.active .glass-panel-container { max-height: 600px; opacity: 1; }
            
            /* Stapel de items onder elkaar op mobiel */
            .certs-grid { flex-direction: column; }
            .cert-item::after { display: none; }
            .cert-item { border-bottom: 1px solid rgba(255,255,255,0.05); }
        }
    </style>
</head>
<body>
